name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # buat upload .dmg ke GitHub Release waktu push tag

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal .app + .dmg
        run: npm run build:mac

      # nama tetap, biar link download di landing page nggak pernah berubah
      - name: Rename .dmg
        run: cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg Ctas-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Ctas-macOS
          path: Ctas-macOS.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ctas-macOS.dmg
          generate_release_notes: true
