<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ctas</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <div class="brand">Ctas<small data-t="tagline"></small></div>
    <div class="langs" role="radiogroup" aria-label="Bahasa / Language">
      <button type="button" class="lang" data-lang="id" role="radio">ID</button>
      <button type="button" class="lang" data-lang="en" role="radio">EN</button>
    </div>
    <button class="btn" id="start" type="button"><span data-t="start"></span> <kbd id="key">⌘⇧X</kbd></button>
  </header>

  <div class="update" id="update" hidden>
    <span id="updText"></span>
    <button class="btn btn-sm" id="updBtn" type="button" data-t="updateNow"></button>
    <div class="upbar" id="upbar" hidden><i id="updBar"></i></div>
  </div>

  <div class="stick">
    <section class="preview" aria-label="Preview">
      <canvas id="stage"></canvas>
      <p class="hint" id="hint"></p>
      <div class="hud"><span id="count"></span><div class="bar"><i id="bar"></i></div></div>
    </section>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="whips" data-t="whips"></button>
      <button type="button" role="tab" data-tab="custom" data-t="customize"></button>
      <button type="button" role="tab" data-tab="general" data-t="general"></button>
    </nav>
  </div>

  <main>
    <section class="pane" data-pane="whips">
      <div class="tiles" id="tiles" role="radiogroup"></div>
      <p class="tip" data-t="tipKeys"></p>
    </section>

    <section class="pane" data-pane="custom">
      <div class="row-head"><h2><span id="curName" class="accent"></span></h2><button class="link" id="resetOne" type="button" data-t="reset"></button></div>
      <div class="card">
        <label class="field"><span><span data-t="length"></span> <output id="oLen"></output></span><input type="range" id="len"></label>
        <label class="field"><span><span data-t="stiffness"></span> <output id="oBend"></output></span><input type="range" id="bend"></label>
        <label class="field"><span><span data-t="weight"></span> <output id="oGrav"></output></span><input type="range" id="grav"></label>
      </div>
      <div class="card colors">
        <label class="color"><input type="color" id="rope"><span><b data-t="rope"></b><code id="oRope"></code></span></label>
        <label class="color"><input type="color" id="grip"><span><b data-t="handle"></b><code id="oGrip"></code></span></label>
      </div>
      <div class="card grid">
        <label class="field"><span data-t="sound"></span><select id="sound"></select></label>
        <label class="field"><span data-t="effect"></span><select id="fx"></select></label>
        <label class="field wide"><span data-t="word"></span><input type="text" id="word" maxlength="16"></label>
      </div>
      <label class="switch"><span><b data-t="showWord"></b><span data-t="showWordSub"></span></span><input type="checkbox" id="showWord"></label>
    </section>

    <section class="pane" data-pane="general">
      <h3 data-t="groupMode"></h3>
      <div class="modes" role="radiogroup">
        <label class="mode"><input type="radio" name="mode" value="follow"><span><b data-t="modeFollow"></b><span data-t="modeFollowSub"></span></span></label>
        <label class="mode"><input type="radio" name="mode" value="click"><span><b data-t="modeClick"></b><span data-t="modeClickSub"></span></span></label>
      </div>
      <p class="note" id="clickNote" hidden data-t="linuxNote"></p>

      <h3 data-t="groupView"></h3>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="view" value="2d"><span>2D</span></label>
        <label><input type="radio" name="view" value="3d"><span>3D</span></label>
      </div>
      <p class="sub" id="viewSub"></p>
      <p class="note" id="viewNote" hidden data-t="view3dFail"></p>

      <h3 data-t="groupFeel"></h3>
      <div class="card">
        <label class="field"><span><span data-t="easy"></span> <output id="oSens"></output></span><input type="range" id="sensitivity"></label>
        <label class="field"><span><span data-t="volume"></span> <output id="oVol"></output></span><input type="range" id="volume"></label>
      </div>

      <h3 data-t="groupNag"></h3>
      <label class="switch"><span><b data-t="nag"></b><span data-t="nagSub"></span><em class="mac-only" data-t="nagMac"></em></span><input type="checkbox" id="nag"></label>
      <label class="switch"><span><b data-t="autosend"></b><span data-t="autosendSub"></span></span><input type="checkbox" id="autosend"></label>

      <h3 data-t="about"></h3>
      <div class="about">
        <span><b>Ctas</b> <code id="version"></code></span>
        <span class="status" id="updStatus"></span>
        <button class="ghost" id="checkUpd" type="button" data-t="checkUpdate"></button>
      </div>
      <p class="foot" id="foot"></p>
    </section>
  </main>

  <script type="module" src="js/panel.js"></script>
</body>
</html>
